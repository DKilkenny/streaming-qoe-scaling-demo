name: angel-streaming-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      POSTGRES_DB: streaming
    # No host port: the app reaches Postgres over the compose network. Avoids
    # clashing with a local Postgres. Expose with `-p 55432:5432` if you want to psql in.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming -d streaming"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # Internal only (avoids clashing with a local Redis on 6379).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: streaming
      RABBITMQ_DEFAULT_PASS: streaming
    # amqp (5672) and the prometheus port (15692) stay internal; only the
    # management UI is published, remapped to 15673 to avoid a local RabbitMQ.
    ports:
      - "15673:15672"   # management UI  ->  http://localhost:15673
    volumes:
      - ./observability/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    image: streaming-app
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://streaming:streaming@postgres:5432/streaming
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://streaming:streaming@rabbitmq:5672
      CACHE_TTL_SECONDS: "30"
      ROLE: api
      # Simulated per-instance entitlement-concurrency cap (see api/src/config.ts):
      # ~one instance saturates around PLAYBACK_MAX_INFLIGHT / (PLAYBACK_COST_MS/1000)
      # playback-starts/s. Applies to every api replica, compose or dynamically
      # provisioned, since they inherit this env.
      PLAYBACK_COST_MS: "10"
      PLAYBACK_MAX_INFLIGHT: "20"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    # No host port: multiple replicas can't share one, and the control plane
    # provisions/removes api containers on demand (see controlplane/src/docker.ts).
    # The `lb` service fronts the pool on host :3000 instead.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # nginx load balancer in front of the api pool. The backend list lives in
  # a control-plane-generated file (lbdynamic volume) that's included into a
  # real `upstream` block with keepalive (see lb/nginx.conf) — the control
  # plane rewrites it and reloads nginx whenever the api pool changes
  # (see controlplane/src/docker.ts: writeApiUpstream).
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
      - lbdynamic:/etc/nginx/dynamic
    ports:
      - "3000:80"   # host :3000 now goes through the LB to an api replica
    # Seed a default upstream (just the compose "api" alias) before the
    # control plane has written anything, so nginx has a valid config to
    # start with — avoids a chicken-and-egg startup race with controlplane.
    command: ["sh", "-c", "[ -f /etc/nginx/dynamic/api_upstream.conf ] || echo 'server api:3000;' > /etc/nginx/dynamic/api_upstream.conf; exec nginx -g 'daemon off;'"]
    depends_on:
      - api

  worker:
    build:
      context: ./api
    image: streaming-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://streaming:streaming@postgres:5432/streaming
      RABBITMQ_URL: amqp://streaming:streaming@rabbitmq:5672
      ROLE: worker
      WORKER_PREFETCH: "4"
      WORKER_EVENT_MS: "4"
      WORKER_COLDSTART_MS: "12000"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  k6:
    image: grafana/k6:0.53.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./load:/scripts:ro
    # Run a load test:  docker compose run --rm k6 run /scripts/discover.js

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: "https://localhost/"
      GF_SERVER_DOMAIN: "localhost"
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Distributed tracing. API + worker export OTLP traces here.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Bound in-memory span storage so a high-rate storm can't OOM it.
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "16686:16686"   # Jaeger UI

  # Load Console: serves the control UI, generates real load, controls the warm
  # worker pool (autoscaler + chaos), and calls OpenRouter for the AI explainer.
  controlplane:
    build:
      context: ./controlplane
    environment:
      PORT: "8080"
      API_BASE: http://lb
      PROMETHEUS_BASE: http://prometheus:9090
      JAEGER_UI_BASE: "${JAEGER_UI_BASE:-https://jaeger.localhost}"
      COMPOSE_PROJECT: angel-streaming-demo
      WORKER_SERVICE: worker
      MIN_WORKERS: "1"
      MAX_WORKERS: "5"
      MIN_API: "1"
      MAX_API: "4"
      SCALE_UP_BACKLOG: "2000"
      SCALE_DOWN_BACKLOG: "200"
      SCALE_DOWN_PUBLISH_RATE: "500"
      WORKER_COLDSTART_MS: "12000"
      WORKER_CAPACITY: "550"
      VST_SCALE_UP_MS: "80"
      VST_SCALE_DOWN_MS: "20"
      API_CAPACITY: "2000"
      API_SCALE_DOWN_MARGIN: "0.7"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}"
    ports:
      - "8080:8080"
    volumes:
      # Read/write access to the Docker socket so it can create/remove worker
      # containers on demand. Demo-only convenience; a production version
      # would call the ECS/K8s API instead.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same dynamic-upstream volume as `lb`: controlplane writes the
      # generated api_upstream.conf here, then execs `nginx -s reload`
      # inside the lb container to pick it up (see docker.ts).
      - lbdynamic:/etc/nginx/dynamic
    depends_on:
      - api
      - lb
      - prometheus

  # TLS-terminating reverse proxy. Serves the stack over HTTPS with a locally
  # trusted mkcert certificate, so browsers that force https on localhost work.
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
    depends_on:
      - grafana
      - api
      - lb
      - prometheus
      - controlplane
      - jaeger

volumes:
  pgdata:
  lbdynamic:
