worker_processes auto;
events {
  # Default (512) undersizes the ~3000 concurrent connections the
  # playbackSurge herd produces, which was surfacing as ~30% client errors
  # (connection refusals) unrelated to the api tier's own capacity. Raised
  # well above the herd's peak concurrency.
  worker_connections 4096;
}
http {
  # Docker's embedded DNS server. Resolving through it (instead of letting
  # nginx cache the upstream at startup) is what lets API replicas the
  # control plane creates/removes on demand be picked up with NO reload:
  # each request re-resolves "api" and gets the current set of containers
  # carrying that network alias.
  resolver 127.0.0.11 valid=1s ipv6=off;
  server {
    listen 80;
    location / {
      # A variable in proxy_pass forces nginx to resolve at request time via
      # the resolver above, rather than once at config load (which is what a
      # bare `proxy_pass http://api:3000;` would do).
      set $api_upstream "api:3000";
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
      # Keepalive to the upstream reduces per-request TCP/connection churn
      # under the herd (each connection re-resolves via the resolver above,
      # so keepalive doesn't defeat the dynamic-upstream picture).
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
