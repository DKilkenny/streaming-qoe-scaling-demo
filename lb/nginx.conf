worker_processes auto;
# Raise the per-worker file-descriptor ceiling so a burst of concurrent
# upstream connections (mixed multi-route traffic) can't exhaust fds.
worker_rlimit_nofile 65535;
events {
  # Sized well above the peak concurrency a herd or a mixed-traffic preset
  # produces (the load generator caps itself around 3000 in-flight).
  worker_connections 16384;
}
http {
  # Real upstream block (not a resolved variable) so nginx can keep a
  # persistent, pooled set of connections to each api replica instead of
  # opening a fresh TCP connection per request. The backend list is NOT
  # static: it's included from a file the control plane regenerates and
  # reloads nginx for whenever the api pool scales (see
  # controlplane/src/docker.ts: writeApiUpstream). OSS nginx can't combine
  # `server ... resolve` (dynamic DNS re-resolution) with `keepalive` — that
  # combo is nginx-plus only — so the control plane supplies the backend
  # list directly instead of relying on Docker DNS at request time.
  upstream api_pool {
    include /etc/nginx/dynamic/api_upstream.conf;   # server <ip>:3000; lines, one per running api container
    keepalive 256;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      # Required for upstream keepalive reuse: proxy_pass sets Connection
      # to "close" by default, which would defeat the pooled connections
      # above.
      proxy_set_header Connection "";
      # Generous connect timeout + retries: a transient upstream connection
      # hiccup (e.g. the brief window during an nginx reload while the
      # backend list changes) retries against another pool member instead
      # of surfacing as a 502.
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
    }
  }
}
