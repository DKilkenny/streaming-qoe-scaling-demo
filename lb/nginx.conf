events {}
http {
  # Docker's embedded DNS server. Resolving through it (instead of letting
  # nginx cache the upstream at startup) is what lets API replicas the
  # control plane creates/removes on demand be picked up with NO reload:
  # each request re-resolves "api" and gets the current set of containers
  # carrying that network alias.
  resolver 127.0.0.11 valid=1s ipv6=off;
  server {
    listen 80;
    location / {
      # A variable in proxy_pass forces nginx to resolve at request time via
      # the resolver above, rather than once at config load (which is what a
      # bare `proxy_pass http://api:3000;` would do).
      set $api_upstream "api:3000";
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
