worker_processes auto;
# Raise the per-worker file-descriptor ceiling so a burst of concurrent
# upstream connections (mixed multi-route traffic) can't exhaust fds.
worker_rlimit_nofile 65535;
events {
  # Sized well above the peak concurrency a herd or a mixed-traffic preset
  # produces (the load generator caps itself around 3000 in-flight).
  worker_connections 16384;
}
http {
  # Docker's embedded DNS. A variable in proxy_pass (below) forces nginx to
  # resolve "api" through this at request time rather than caching it once at
  # startup, which is what lets API replicas the control plane creates/removes
  # on demand be picked up with NO reload. valid=10s keeps it to a cached
  # lookup per interval, not a lookup on literally every request.
  #
  # (An upstream{} block with keepalive would give connection pooling, but the
  # `resolve` parameter needed to keep it dynamic is nginx-plus only — so with
  # open-source nginx we keep the dynamic variable proxy_pass and harden it for
  # reliability under mixed, multi-route concurrent traffic instead.)
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    location / {
      set $api_upstream "api:3000";
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      # Generous connect timeout + retries: a transient upstream connection
      # hiccup under combined discover + beacon + playback/start load retries
      # (re-resolving the current replica set) instead of returning a 502.
      # The tight 2s connect timeout + no retries was surfacing as ~2-10% 502s
      # under episodePremiere / trailerDrop once ALL API traffic routed here.
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
    }
  }
}
