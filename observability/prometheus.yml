global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  # The worker is a scaled pool; Docker DNS returns an A record per replica,
  # so DNS service discovery scrapes every worker (paused ones just read down).
  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 3000
        refresh_interval: 5s

  - job_name: controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
