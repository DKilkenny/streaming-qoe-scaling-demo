global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # The api tier is a scaled pool behind the LB; Docker DNS returns an A
  # record per replica (each dynamically-created container carries the "api"
  # network alias), so DNS service discovery scrapes every replica.
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 5s

  # The worker is a scaled pool; Docker DNS returns an A record per replica,
  # so DNS service discovery scrapes every worker (paused ones just read down).
  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 3000
        refresh_interval: 5s

  - job_name: controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
