global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
